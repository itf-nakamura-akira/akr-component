<div class="flex flex-col gap-8 p-8 max-w-4xl mx-auto">
    <section>
        <h1 class="text-3xl font-bold mb-4">Navigation Tree</h1>
        <p class="text-gray-600 mb-6">
            A hierarchical navigation component for displaying structured data with support for icons and selection
            events.
        </p>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Basic Usage</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="basicNodes" />
        </div>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Selection Event</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="basicNodes" (selectionChange)="onSelectionChange($event)" />
        </div>
        <p class="text-sm text-gray-600">
            Selected Node: <strong>{{ selectionResult() }}</strong>
        </p>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">With Icons</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="iconNodes">
                <ng-template akrNavigationTreeIcon let-node>
                    <span aria-hidden="true" class="material-symbols-outlined" translate="no">
                        {{ node.icon }}
                    </span>
                </ng-template>
            </akr-navigation-tree>
        </div>
    </section>
</div>
