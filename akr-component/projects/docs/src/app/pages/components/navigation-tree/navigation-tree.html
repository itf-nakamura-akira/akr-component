<div class="flex flex-col gap-8 w-120">
    <section class="flex flex-col gap-4">
        <h2 class="text-lg font-bold">Basic Usage</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="basicNodes" />
        </div>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-lg font-bold">Selection Event</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="basicNodes" (selectionChange)="onSelectionChange($event)" />
        </div>
        <p class="text-sm text-gray-600">
            Selected Node: <strong>{{ selectionResult() }}</strong>
        </p>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-lg font-bold">With Icons</h2>
        <div class="border rounded p-4 bg-white">
            <akr-navigation-tree [nodes]="iconNodes">
                <ng-template akrNavigationTreeIcon let-node>
                    <span aria-hidden="true" class="material-symbols-outlined" translate="no">
                        {{ node.icon }}
                    </span>
                </ng-template>
            </akr-navigation-tree>
        </div>
    </section>
</div>
