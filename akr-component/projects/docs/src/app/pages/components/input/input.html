<div class="flex flex-col gap-8 p-8 max-w-4xl mx-auto">
    <section>
        <h1 class="text-3xl font-bold mb-4">Input</h1>
        <p class="text-gray-600 mb-6">
            Standard input fields for user data entry, supporting validation, hints, and various states.
        </p>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Basic Usage</h2>
        <akr-form-field label="Username">
            <input akr-input placeholder="Enter your username" />
        </akr-form-field>

        <akr-form-field label="Password">
            <input akr-input type="password" placeholder="Enter your password" />
        </akr-form-field>

        <akr-form-field label="Age">
            <input akr-input type="number" placeholder="0" />
        </akr-form-field>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Validation & Hints</h2>
        <akr-form-field label="Email" [required]="true">
            <input akr-input type="email" placeholder="example@mail.com" hintMessage="We'll never share your email." />
        </akr-form-field>

        <akr-form-field label="Required field" [required]="true">
            <input akr-input value="invalid input" [invalid]="true" errorMessage="This field is required" />
        </akr-form-field>

        <akr-form-field label="Priority Check">
            <input
                akr-input
                value="has error"
                [invalid]="true"
                errorMessage="Error has higher priority than hint"
                hintMessage="This hint will be hidden"
            />
        </akr-form-field>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">States</h2>
        <akr-form-field label="Readonly">
            <input akr-input value="you can't edit this" readonly />
        </akr-form-field>

        <akr-form-field label="Disabled">
            <input akr-input value="this is disabled" disabled />
        </akr-form-field>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Standalone Input</h2>
        <input akr-input placeholder="Input without form field" />
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-4">Customization</h2>
        <app-input-custom-required />
    </section>
</div>
