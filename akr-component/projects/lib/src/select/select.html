<div ngCombobox readonly>
    <div #origin class="select">
        <span class="combobox-label">
            <span class="selected-label-icon material-symbols-outlined" translate="no" aria-hidden="true">{{
                displayIcon()
            }}</span>
            <span class="selected-label-text">{{ displayValue() }}</span>
        </span>
        <input aria-label="Option dropdown" placeholder="Select an option" ngComboboxInput />
        <span class="select-arrow material-symbols-outlined" translate="no" aria-hidden="true">arrow_drop_down</span>
    </div>
    <ng-template ngComboboxPopupContainer>
        <ng-template
            [cdkConnectedOverlay]="{ origin, usePopover: 'inline', matchWidth: true }"
            [cdkConnectedOverlayOpen]="true"
        >
            <div class="select-popup-container">
                <div ngListbox>
                    @for (option of options(); track option.value) {
                        <div ngOption [value]="option.value" [label]="option.value">
                            <span
                                class="select-option-icon material-symbols-outlined"
                                translate="no"
                                aria-hidden="true"
                                >{{ option.icon }}</span
                            >
                            <span class="select-option-text">{{ option.value }}</span>
                            <span
                                class="select-option-check material-symbols-outlined"
                                translate="no"
                                aria-hidden="true"
                                >check</span
                            >
                        </div>
                    }
                </div>
            </div>
        </ng-template>
    </ng-template>
</div>
