<div
    class="akr-select-container"
    [class.akr-expanded]="expanded()"
    [attr.aria-disabled]="disabled() ? 'true' : 'false'"
>
    <div cdkOverlayOrigin #origin="cdkOverlayOrigin" class="select" (click)="toggleExpanded($event)">
        <span class="combobox-label">
            @if (selectedIcon() && iconTemplate()) {
                <span class="selected-label-icon">
                    <ng-container
                        [ngTemplateOutlet]="iconTemplate()!"
                        [ngTemplateOutletContext]="{ $implicit: selectedIcon() }"
                    />
                </span>
            }
            <span class="selected-label-text">{{ displayValue() }}</span>
        </span>
        <input
            [aria-label]="placeholder() || 'Select an option'"
            [placeholder]="placeholder()"
            class="akr-select-input"
            [disabled]="disabled()"
            readonly
            (click)="$event.stopPropagation()"
        />
        <akr-icon
            class="example-arrow"
            [class.akr-expanded]="expanded()"
            name="keyboard_arrow_down"
            translate="no"
            aria-hidden="true"
        />
    </div>

    <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="origin"
        [cdkConnectedOverlayOpen]="expanded()"
        [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
        (overlayOutsideClick)="expanded.set(false)"
    >
        <div class="example-popup-container" (click)="$event.stopPropagation()">
            <div role="listbox" [attr.aria-multiselectable]="multiple() ? 'true' : 'false'">
                @for (option of options(); track option.value) {
                    <div
                        role="option"
                        class="akr-option"
                        [attr.aria-selected]="isOptionSelected(option) ? 'true' : 'false'"
                        [attr.aria-disabled]="option.disabled ? 'true' : 'false'"
                        (click)="toggleOption(option, $event)"
                    >
                        @if (option.icon && iconTemplate()) {
                            <span class="example-option-icon">
                                <ng-container
                                    [ngTemplateOutlet]="iconTemplate()!"
                                    [ngTemplateOutletContext]="{ $implicit: option.icon }"
                                />
                            </span>
                        }
                        <span class="example-option-text">{{ option.value }}</span>
                        <akr-icon class="example-option-check" name="check" translate="no" aria-hidden="true" />
                    </div>
                }
            </div>
        </div>
    </ng-template>
</div>
