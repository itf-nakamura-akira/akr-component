<div ngCombobox [aria-disabled]="isDisabled()" readonly (blur)="_handleBlur()">
    <div #origin class="select">
        <span class="combobox-label">
            @if (customIcon() && selectedOption()) {
                <ng-container
                    *ngTemplateOutlet="customIcon()!.template; context: { $implicit: selectedOption() }"
                ></ng-container>
            } @else if (displayIcon()) {
                <span class="selected-label-icon material-symbols-outlined" translate="no" aria-hidden="true">{{
                    displayIcon()
                }}</span>
            }
            <span class="selected-label-text">{{ displayValue() }}</span>
        </span>
        <input aria-label="Option dropdown" placeholder="Select an option" ngComboboxInput [disabled]="isDisabled()" />
        <akr-icon class="select-arrow" name="keyboard_arrow_down" translate="no" aria-hidden="true"></akr-icon>
    </div>
    <ng-template ngComboboxPopupContainer>
        <ng-template
            [cdkConnectedOverlay]="{ origin, usePopover: 'inline', matchWidth: true }"
            [cdkConnectedOverlayOpen]="true"
        >
            <div class="select-popup-container">
                <div ngListbox [values]="[_value()]">
                    @for (option of options(); track option.value) {
                        <div ngOption [value]="option.value" [label]="option.label" [disabled]="option.disabled">
                            @if (customIcon()) {
                                <ng-container
                                    *ngTemplateOutlet="customIcon()!.template; context: { $implicit: option }"
                                ></ng-container>
                            } @else if (option.icon) {
                                <span
                                    class="select-option-icon material-symbols-outlined"
                                    translate="no"
                                    aria-hidden="true"
                                    >{{ option.icon }}</span
                                >
                            }
                            <span class="select-option-text">{{ option.label }}</span>
                            <akr-icon
                                class="select-option-check"
                                name="check"
                                translate="no"
                                aria-hidden="true"
                            ></akr-icon>
                        </div>
                    }
                </div>
            </div>
        </ng-template>
    </ng-template>
</div>
