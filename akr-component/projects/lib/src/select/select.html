<div
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    class="akr-select-trigger"
    [class.akr-placeholder]="selectedItems().length === 0"
    (click)="toggleExpanded($event)"
    (keydown.enter)="toggleExpanded($event)"
    (keydown.space)="toggleExpanded($event)"
    tabindex="0"
    role="combobox"
    [attr.aria-expanded]="expanded()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-label]="placeholder() || 'Select an option'"
    [attr.aria-controls]="expanded() ? listboxId : null"
>
    <div class="akr-select-value">
        @for (item of selectedItems(); track item.value) {
            @if (item.icon && iconTemplate()) {
                <span class="akr-selected-icon">
                    <ng-container
                        [ngTemplateOutlet]="iconTemplate()!"
                        [ngTemplateOutletContext]="{ $implicit: item.icon }"
                    />
                </span>
            }
            <span>{{ item.value }}{{ !$last ? ',' : '' }}</span>
        }
        @if (selectedItems().length === 0) {
            <span>{{ placeholder() }}</span>
        }
    </div>
    <akr-icon class="akr-select-arrow" name="keyboard_arrow_down" translate="no" aria-hidden="true" />
</div>

<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="expanded()"
    [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
    (overlayOutsideClick)="expanded.set(false)"
>
    <div
        class="akr-select-popup"
        [id]="listboxId"
        role="listbox"
        [attr.aria-multiselectable]="multiple() ? 'true' : 'false'"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
        tabindex="-1"
    >
        @for (option of options(); track option.value) {
            <div
                role="option"
                class="akr-option"
                [attr.aria-selected]="isOptionSelected(option) ? 'true' : 'false'"
                [attr.aria-disabled]="option.disabled ? 'true' : 'false'"
                (click)="toggleOption(option, $event)"
                (keydown.enter)="toggleOption(option, $event)"
                (keydown.space)="toggleOption(option, $event)"
                tabindex="0"
            >
                @if (option.icon && iconTemplate()) {
                    <span class="akr-option-icon">
                        <ng-container
                            [ngTemplateOutlet]="iconTemplate()!"
                            [ngTemplateOutletContext]="{ $implicit: option.icon }"
                        />
                    </span>
                }
                <span class="akr-option-text">{{ option.value }}</span>
                <akr-icon class="akr-option-check" name="check" translate="no" aria-hidden="true" />
            </div>
        }
    </div>
</ng-template>
