<ul ngTree #tree="ngTree" [nav]="true" [(values)]="selected" class="basic-tree">
    <ng-template [ngTemplateOutlet]="treeNodes" [ngTemplateOutletContext]="{ nodes: nodes(), parent: tree }" />
</ul>
<ng-template #treeNodes let-nodes="nodes" let-parent="parent">
    @for (node of nodes; track node.value) {
        <a
            ngTreeItem
            [parent]="parent"
            [value]="node.value"
            [label]="node.name"
            [disabled]="node.disabled"
            [selectable]="!node.children"
            [(expanded)]="node.expanded"
            #treeItem="ngTreeItem"
            [routerLink]="node.routerLink"
        >
            @if (node.icon && customIcon(); as customIcon) {
                <ng-template [ngTemplateOutlet]="customIcon.template" [ngTemplateOutletContext]="{ $implicit: node }" />
            }
            {{ node.name }}
            <span class="spacer"></span>
            <span aria-hidden="true" class="material-symbols-outlined expand-icon" translate="no">
                @if (node.children) {
                    <akr-icon name="keyboard_arrow_right"></akr-icon>
                }
            </span>
        </a>
        @if (node.children) {
            <ul role="group">
                <ng-template ngTreeItemGroup [ownedBy]="treeItem" #group="ngTreeItemGroup">
                    <ng-template
                        [ngTemplateOutlet]="treeNodes"
                        [ngTemplateOutletContext]="{ nodes: node.children, parent: group }"
                    />
                </ng-template>
            </ul>
        }
    }
</ng-template>
