<ul ngTree #tree="ngTree" class="basic-tree" [nav]="true" [(values)]="selected">
    <ng-template [ngTemplateOutlet]="treeNodes" [ngTemplateOutletContext]="{ nodes: nodes(), parent: tree }" />
</ul>
<ng-template #treeNodes let-nodes="nodes" let-parent="parent">
    @for (node of nodes; track node.value) {
        <a
            ngTreeItem
            #treeItem="ngTreeItem"
            [parent]="parent"
            [value]="node.value"
            [label]="node.name"
            [disabled]="node.disabled"
            [selectable]="!node.children"
            [expanded]="expandedValues().has(node.value)"
            (expandedChange)="toggleExpanded(node, $event)"
            [routerLink]="!node.disabled ? node.routerLink : null"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
        >
            @if (node.icon && customIcon(); as customIcon) {
                <ng-template [ngTemplateOutlet]="customIcon.template" [ngTemplateOutletContext]="{ $implicit: node }" />
            }
            {{ node.name }}
            <span class="spacer"></span>
            <span
                aria-hidden="true"
                class="material-symbols-outlined expand-icon"
                translate="no"
                (click)="
                    $event.preventDefault();
                    $event.stopPropagation();
                    toggleExpanded(node, !expandedValues().has(node.value))
                "
            >
                @if (node.children) {
                    <akr-icon name="keyboard_arrow_right"></akr-icon>
                }
            </span>
        </a>
        @if (node.children) {
            <ul role="group">
                <ng-template ngTreeItemGroup #group="ngTreeItemGroup" [ownedBy]="treeItem">
                    <ng-template
                        [ngTemplateOutlet]="treeNodes"
                        [ngTemplateOutletContext]="{ nodes: node.children, parent: group }"
                    />
                </ng-template>
            </ul>
        }
    }
</ng-template>
