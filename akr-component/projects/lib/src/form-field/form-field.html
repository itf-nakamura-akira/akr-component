<div class="form-field">
    @if (label()) {
        <label class="form-field-label" [attr.for]="input().id()">
            {{ label() }}
            @if (required()) {
                <span class="form-field-required-mark" aria-hidden="true">{{ requiredMark }}</span>
            }
        </label>
    }
    <div class="form-field-control">
        <ng-content />
    </div>
    @if (input().invalid() && input().errorMessage()) {
        <div class="form-field-error">
            {{ input().errorMessage() }}
        </div>
    } @else if (input().hintMessage()) {
        <div class="form-field-hint">
            {{ input().hintMessage() }}
        </div>
    }
</div>
