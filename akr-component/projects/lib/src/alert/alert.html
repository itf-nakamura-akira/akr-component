<div
    class="alert"
    role="alert"
    [class.alert-info]="severity() === 'info'"
    [class.alert-success]="severity() === 'success'"
    [class.alert-warning]="severity() === 'warning'"
    [class.alert-error]="severity() === 'error'"
>
    @if (showIcon()) {
        <div class="alert-icon">
            <akr-icon [name]="severity()" />
        </div>
    }
    <div class="alert-message">
        <ng-content />
    </div>
    @if (closable()) {
        <button type="button" class="alert-close" aria-label="Close" (click)="closeAlert.emit()">
            <span class="sr-only">Close</span>
            <akr-icon name="close" />
        </button>
    }
</div>
