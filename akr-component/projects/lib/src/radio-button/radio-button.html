<div
    class="akr-radio-host"
    [attr.data-severity]="severity()"
    [attr.data-checked]="checked()"
    [attr.data-disabled]="isDisabled()"
    [attr.data-variant]="variant()"
>
    <input
        type="radio"
        class="akr-radio-native"
        [attr.name]="name()"
        [attr.value]="value()"
        [checked]="checked()"
        [disabled]="isDisabled()"
        (change)="onInputChange()"
    />
    <div class="akr-radio-box">
        <div class="akr-radio-inner"></div>
    </div>
    <div class="akr-radio-label">
        <div class="akr-radio-title">
            <ng-content select="[akr-radio-title]" />
        </div>
        <div class="akr-radio-description">
            <ng-content select="[akr-radio-description]" />
        </div>
        <div class="akr-radio-content">
            <ng-content />
        </div>
    </div>
</div>
